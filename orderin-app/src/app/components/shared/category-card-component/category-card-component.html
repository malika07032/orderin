<ng-template #cardTemplate let-image="imageUrl" let-title="name" let-count="restaurantCount">
    <div class="card-container">
        <div class="card-img">
            <img [src]="image" alt="category card">
        </div>
        <div class="card-text">
            <div class="title">{{title}}</div>
            <div class="text">{{count}} Restaurants</div>
        </div>
    </div>
</ng-template>
